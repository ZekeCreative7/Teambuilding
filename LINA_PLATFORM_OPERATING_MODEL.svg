<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef7ff"/>
      <stop offset="45%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#edf8f4"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171a3d"/>
      <stop offset="100%" stop-color="#123f46"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6478f6"/>
      <stop offset="100%" stop-color="#2fb7b0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcf65"/>
      <stop offset="100%" stop-color="#ff8f70"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ed1a2"/>
      <stop offset="100%" stop-color="#18a7c2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#19324a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#52637a"/>
    </marker>
    <style>
      .title{font:800 40px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#111827}
      .subtitle{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .boxTitle{font:800 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
      .boxText{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .small{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
      .whiteTitle{font:850 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .whiteText{font:550 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e9f2ff}
      .pillText{font:800 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .card{fill:rgba(255,255,255,.92);stroke:#dbe6f2;stroke-width:1.5;rx:24;filter:url(#shadow)}
      .thin{stroke:#52637a;stroke-width:2.5;fill:none;marker-end:url(#arrow);opacity:.75}
      .dash{stroke:#52637a;stroke-width:2.3;fill:none;marker-end:url(#arrow);stroke-dasharray:8 8;opacity:.65}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <text x="70" y="70" class="title">Lina Culture Platform Operating Model</text>
  <text x="70" y="101" class="subtitle">Pulse Survey 신호를 조직 운영, 세션 설계, 커뮤니케이션, 실행 검증으로 연결하는 데이터 흐름</text>

  <rect x="55" y="135" width="350" height="760" class="card"/>
  <text x="85" y="178" class="boxTitle">1. 입력 데이터</text>
  <text x="85" y="213" class="boxText">Pulse Survey 정본</text>
  <text x="105" y="236" class="small">pulse-seed-data.json</text>
  <text x="85" y="275" class="boxText">조직 마스터 / 구성원</text>
  <text x="105" y="298" class="small">organization_data.js, XLSX/CSV 업로드</text>
  <text x="85" y="337" class="boxText">사용자 편집</text>
  <text x="105" y="360" class="small">조직명, 리더, 직급, 지표, 팀원, 사진</text>
  <text x="85" y="399" class="boxText">실행 일정</text>
  <text x="105" y="422" class="small">WOW x BALANCE 캘린더</text>
  <text x="85" y="461" class="boxText">AI 입력/결과</text>
  <text x="105" y="484" class="small">프롬프트 복사, GPT 답변 붙여넣기</text>
  <text x="85" y="523" class="boxText">인증/승인</text>
  <text x="105" y="546" class="small">Firebase Auth, approvedUsers</text>

  <rect x="455" y="135" width="690" height="190" rx="28" fill="url(#navy)" filter="url(#shadow)"/>
  <text x="490" y="180" class="whiteTitle">2. 공유 상태와 저장소</text>
  <text x="490" y="215" class="whiteText">currentDataset: Pulse 데이터, GPT 분석, 커뮤니케이션 기록</text>
  <text x="490" y="242" class="whiteText">organization state: units, people, sessions, groups, filters, zoom</text>
  <text x="490" y="269" class="whiteText">sessionDesigner state: brief, questions, frames, decisions, slots, board</text>
  <rect x="490" y="287" width="160" height="34" rx="17" fill="url(#blue)"/>
  <text x="522" y="309" class="pillText">localStorage</text>
  <rect x="670" y="287" width="180" height="34" rx="17" fill="url(#green)"/>
  <text x="705" y="309" class="pillText">Firestore</text>
  <rect x="870" y="287" width="225" height="34" rx="17" fill="url(#amber)"/>
  <text x="902" y="309" class="pillText">백업 / 버전 관리</text>

  <rect x="455" y="370" width="310" height="230" class="card"/>
  <text x="485" y="412" class="boxTitle">3A. Pulse 분석 엔진</text>
  <text x="485" y="447" class="boxText">enrichData()</text>
  <text x="505" y="470" class="small">카테고리 평균, 본부 평균, 등급</text>
  <text x="485" y="507" class="boxText">relationshipInsights()</text>
  <text x="505" y="530" class="small">문항 쌍 차이 기반 아하 인사이트</text>
  <text x="485" y="567" class="boxText">buildPulseByOrg()</text>
  <text x="505" y="590" class="small">division.orgId -> 조직 신호 매핑</text>

  <rect x="805" y="370" width="340" height="230" class="card"/>
  <text x="835" y="412" class="boxTitle">3B. Culture Signal Engine</text>
  <text x="835" y="447" class="boxText">positive = FAV - 0.5 * LOW</text>
  <text x="835" y="477" class="boxText">변화 수용도 / 신뢰도</text>
  <text x="835" y="507" class="boxText">피로도/지원 필요 / 문화 리스크</text>
  <text x="835" y="537" class="boxText">X,Y 좌표 + 4분면</text>
  <text x="855" y="567" class="small">위험, 피로도/지원 필요, 안정, 관망</text>

  <rect x="455" y="645" width="310" height="250" class="card"/>
  <text x="485" y="687" class="boxTitle">3C. Organization Engine</text>
  <text x="485" y="722" class="boxText">조직 생성 / 이동 / 삭제</text>
  <text x="485" y="752" class="boxText">구성원 이동 / 삭제 / 직급</text>
  <text x="485" y="782" class="boxText">리더 호칭 / 팀장 설정</text>
  <text x="485" y="812" class="boxText">조직 XLSX 템플릿</text>
  <text x="485" y="842" class="boxText">업로드 전 백업</text>
  <text x="505" y="866" class="small">없는 행은 삭제하지 않음</text>

  <rect x="805" y="645" width="340" height="250" class="card"/>
  <text x="835" y="687" class="boxTitle">3D. Execution Engine</text>
  <text x="835" y="722" class="boxText">WOW x BALANCE 캘린더</text>
  <text x="835" y="752" class="boxText">날짜가 지나면 진행 칩 완료</text>
  <text x="835" y="782" class="boxText">타겟그룹 생성</text>
  <text x="835" y="812" class="boxText">세션 디자이너 컨텍스트 전달</text>
  <text x="835" y="842" class="boxText">커뮤니케이션 기록 저장</text>

  <rect x="1195" y="135" width="350" height="760" class="card"/>
  <text x="1225" y="178" class="boxTitle">4. 출력 / 운영 화면</text>
  <text x="1225" y="213" class="boxText">Culture Dashboard</text>
  <text x="1245" y="236" class="small">전사 현황, 위험 본부, 취약 문항</text>
  <text x="1225" y="275" class="boxText">Culture Intelligence</text>
  <text x="1245" y="298" class="small">본부/문항 분석, GPT 프롬프트</text>
  <text x="1225" y="337" class="boxText">People &amp; Organization</text>
  <text x="1245" y="360" class="small">조직도, 상세 정보, 설정</text>
  <text x="1225" y="399" class="boxText">Culture Propagation Map</text>
  <text x="1245" y="422" class="small">전사/부문/본부/팀 분포</text>
  <text x="1225" y="461" class="boxText">Calendar</text>
  <text x="1245" y="484" class="small">월/주/일 일정과 완료 신호</text>
  <text x="1225" y="523" class="boxText">Target Groups</text>
  <text x="1245" y="546" class="small">목적 기반 대상 묶음</text>
  <text x="1225" y="585" class="boxText">Campaign Studio</text>
  <text x="1245" y="608" class="small">세션 브리프, 슬롯, 원페이저</text>
  <text x="1225" y="647" class="boxText">Message Center</text>
  <text x="1245" y="670" class="small">스피치/공지문, 기록 재사용</text>
  <text x="1225" y="709" class="boxText">Data &amp; Firebase</text>
  <text x="1245" y="732" class="small">업로드, 버전, JSON 다운로드</text>

  <path d="M405 255 C435 255 425 230 455 230" class="thin"/>
  <path d="M765 485 C785 485 785 485 805 485" class="thin"/>
  <path d="M1145 485 C1170 485 1170 350 1195 350" class="thin"/>
  <path d="M1145 755 C1170 755 1170 555 1195 555" class="thin"/>
  <path d="M765 755 C785 755 785 755 805 755" class="thin"/>
  <path d="M610 325 C610 350 610 350 610 370" class="thin"/>
  <path d="M975 325 C975 350 975 350 975 370" class="thin"/>
  <path d="M975 600 C975 625 975 625 975 645" class="thin"/>
  <path d="M610 600 C610 625 610 625 610 645" class="thin"/>

  <rect x="55" y="935" width="1490" height="75" rx="24" fill="#ffffff" stroke="#dbe6f2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="85" y="965" class="boxTitle">현재 AI 루프</text>
  <text x="245" y="965" class="boxText">프롬프트 생성 -> 외부 GPT 복사/붙여넣기 -> 결과 붙여넣기 -> 저장</text>
  <path d="M790 960 L875 960" class="dash"/>
  <text x="905" y="965" class="boxTitle">다음 구조</text>
  <text x="1045" y="965" class="boxText">Cloud Function + OpenAI API + JSON 스키마 + AI Run Registry + 사람 승인 적용</text>

  <rect x="455" y="1030" width="690" height="40" rx="20" fill="url(#blue)"/>
  <text x="520" y="1056" class="pillText">Detect -> Interpret -> Design -> Deliver -> Verify: 조직문화 운영체계의 핵심 루프</text>
</svg>
